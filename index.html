<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview Prep Handbook</title>
  <meta name="description" content="Interview preparation handbook: Python, React, GenAI, agents, LangGraph, AgentCore, AWS, DevOps, system design, DSA and databases.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237aa7ff'/%3E%3Cpath d='M9 22V10h3v12zM15 22V10h5a4 4 0 0 1 0 8h-2v4zm3-7h2a1 1 0 0 0 0-2h-2z' fill='%23131922'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/flow.css">
  <script>
    // set theme before first paint to avoid a flash
    try {
      var t = JSON.parse(localStorage.getItem("ip.state") || "{}").theme;
      if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body data-mode="home">
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open course list" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">IP</span>
      <span class="brand-name">Interview Prep</span>
    </a>
    <button class="search-trigger" id="searchBtn" aria-label="Search all questions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <span>Search questions</span>
      <kbd id="searchKbd">Ctrl K</kbd>
    </button>
    <nav class="top-actions">
      <a class="text-btn" href="#/cards/all">Flashcards</a>
      <button class="icon-btn" id="themeBtn" aria-label="Switch colour theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Courses">
      <div class="sidebar-inner" id="courseNav"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main id="main" class="main" tabindex="-1">
      <div class="loading">Loading…</div>
    </main>

    <aside class="outline" id="outline" aria-label="On this page"></aside>
  </div>

  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search" hidden>
    <div class="palette-box">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="searchInput" type="search" placeholder="Search 900+ questions, e.g. isolation level, interrupt, IMDSv2" autocomplete="off" spellcheck="false" aria-controls="searchResults">
        <kbd>Esc</kbd>
      </div>
      <div class="palette-results" id="searchResults" role="listbox"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/vendor/hljs-dockerfile.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
